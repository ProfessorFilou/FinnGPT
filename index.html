<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Finn KI 🌑</title>
<link rel="icon" type="image/jpeg" href="ProfessorFilou_LOGO.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#1e1e1e; color:#e0e0e0; display:flex; flex-direction:column; min-height:100vh; }
#topBar { display:flex; justify-content:flex-end; padding:10px 20px; background:#2d2d2d; gap:10px; align-items:center; flex-wrap:wrap; }
#profile { width:auto; height:auto; padding:5px 10px; border-radius:10px; background:#6cb6ff; display:flex; justify-content:center; align-items:center; font-size:16px; cursor:pointer; margin-right:auto; }
button { background:#fff; color:#1e1e1e; border:none; border-radius:15px; padding:5px 15px; cursor:pointer; white-space:nowrap; }
#chat { flex:1; overflow-y:auto; padding:20px; scroll-behavior:smooth; }
.message { margin:10px 0; max-width:80%; padding:10px 15px; border-radius:15px; animation:fadeIn 0.3s; }
.user { background:#2d2d2d; align-self:flex-end; color:#9cdcfe; }
.bot { background:#3c3c3c; align-self:flex-start; color:#dcdcaa; }
#inputArea { display:flex; padding:10px; background:#2d2d2d; gap:10px; flex-wrap:wrap; }
#userInput { flex:1; padding:12px 15px; border-radius:25px; border:none; background:#3c3c3c; color:#e0e0e0; font-size:16px; min-width:0; }
#sendBtn { border:none; border-radius:50%; width:50px; height:50px; background:white; color:#1e1e1e; cursor:pointer; display:flex; justify-content:center; align-items:center; font-size:20px; transition:transform 0.2s; flex-shrink:0; }
#sendBtn:hover { transform:scale(1.1); }
footer { text-align:center; padding:10px; font-size:12px; color:#888; background:#1b1b1b; }
#welcome { text-align:center; margin:40px 0; font-size:36px; font-weight:bold; background:linear-gradient(90deg,#ff6ec7,#6cb6ff,#ffeb3b,#ff6ec7); -webkit-background-clip:text; color:transparent; }
#welcomeContainer { display:flex; flex-direction:column; align-items:center; justify-content:center; }
@keyframes fadeIn { from {opacity:0} to {opacity:1} }
</style>
</head>
<body>

<div id="topBar">
  <div id="profile">Gast</div>
  <button id="contactBtn">Kontakt</button>
  <button id="gameBtn">Spiel</button>
</div>

<div id="welcomeContainer">
  <div id="welcome">Willkommen zurück, <span id="welcomeName">Gast</span>!</div>
</div>

<div id="chat"></div>
<div id="inputArea">
  <input id="userInput" placeholder="Schreib was..." />
  <button id="sendBtn">✈️</button>
</div>

<footer>© Finn v. Khreninger</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyD5Upbs8gKKAsIMS6rfENLlaMO2Rrq-tLM",
  authDomain: "finnki.firebaseapp.com",
  databaseURL: "https://finnki-default-rtdb.firebaseio.com",
  projectId: "finnki",
  storageBucket: "finnki.firebasestorage.app",
  messagingSenderId: "871648785587",
  appId: "1:871648785587:web:a2bfeacbac9ec88521ecc6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Nutzername
let userName = localStorage.getItem("userName") || "Gast";
document.getElementById("welcomeName").textContent = userName;
document.getElementById("profile").textContent = userName;

const chatDiv = document.getElementById("chat");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const welcomeContainer = document.getElementById("welcomeContainer");

const defaultResponses = ["Interessant!","Erzähl mir mehr!","Hmmm… spannend 🤔"];

// Bot Response
async function getBotResponse(message){
  message = message.toLowerCase().trim();
  const dbRef = ref(db, 'knowledge');
  const snapshot = await get(dbRef);
  const knowledge = snapshot.val() || {};

  for(let key in knowledge){
    if(message.includes(knowledge[key].key)) return knowledge[key].response;
  }

  // Bot kennt Antwort nicht → fragt Nutzer
  const userAnswer = prompt(`Ich kenne die Antwort auf "${message}" nicht. Was soll ich antworten?`);
  if(userAnswer){
    const newRef = push(dbRef);
    set(newRef, { key: message, response: userAnswer });
    return userAnswer;
  }

  return defaultResponses[Math.floor(Math.random()*defaultResponses.length)];
}

// Send Message
async function sendMessage(){
  const message = userInput.value.trim();
  if(!message) return;
  if(welcomeContainer.style.display!=="none") welcomeContainer.style.display="none";

  chatDiv.innerHTML += `<div class="message user">Du: ${message}</div>`;
  userInput.value = "";
  chatDiv.scrollTop = chatDiv.scrollHeight;

  const botResponse = await getBotResponse(message);
  chatDiv.innerHTML += `<div class="message bot">Bot: ${botResponse}</div>`;
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keypress", e=>{ if(e.key==="Enter") sendMessage(); });

// Name ändern
document.getElementById("profile").addEventListener("click", ()=>{
  const newName = prompt("Wie soll dein Name heißen?", userName);
  if(newName){ 
    userName = newName; 
    localStorage.setItem("userName", userName); 
    document.getElementById("welcomeName").textContent = userName; 
    document.getElementById("profile").textContent = userName;
  }
});

// Spiel & Kontakt Buttons (unverändert)
document.getElementById("gameBtn").addEventListener("click", ()=>{ window.open("https://professorfilou.github.io/EmojiClick2001-ULTRA/","_blank"); });
</script>
</body>
</html>
